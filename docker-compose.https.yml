# Optional portable TLS edge. Supply a site hostname and unique network range.
# Usage: docker compose -f docker-compose.yml -f docker-compose.https.yml --env-file /secure/wonham.env ...
services:
  app:
    environment:
      TRUSTED_PROXIES: ${PROXY_ADDRESS:-172.30.240.254}
      FORCE_HTTPS: "true"
  proxy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set a hostname or temporary localhost address}
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: ${PROXY_ADDRESS:-172.30.240.254}
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.240.0/24}
volumes:
  caddy_data:
  caddy_config:
