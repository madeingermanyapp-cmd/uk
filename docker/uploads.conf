<Directory /var/www/html/public/uploads>
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/public/uploads/manor>
    Require all denied
</Directory>
# Capability URLs must not be written into access logs.
SetEnvIf Request_URI "^/manor/(request|invitation|check-in|recover|document|quotation)(/|$)" private_route
