name: Verify application and agent parity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contracts-and-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: calendar, intl, curl, fileinfo, gd, mbstring, openssl, pdo_mysql, sodium, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - name: Require a reviewed parity decision and a current rendered ledger
        run: php scripts/check-agent-parity.php --check-render
      - name: Require every user-facing string to go through translations
        run: python3 scripts/audit-i18n.py --include-api
      - name: Require canonical design tokens in every stylesheet
        run: python3 scripts/audit-css-tokens.py
      - name: Validate the generated v2 OpenAPI 3.1 document with an external validator
        run: |
          mkdir -p "$RUNNER_TEMP/agent-docs"
          php scripts/export-agent-docs.php "$RUNNER_TEMP/agent-docs"
          npx --yes @redocly/cli@2.57.0 lint --extends=spec --format=stylish "$RUNNER_TEMP/agent-docs/openapi.json"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require committed production assets
        run: git diff --exit-code -- public/assets
  disposable-database:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            mysql: '8.0'
          - php: '8.5'
            mysql: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: calendar, intl, curl, fileinfo, gd, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, sodium, zip
          coverage: none
          # setup-php defaults to JIT mode 1235. On PHP 8.3 its call-graph type
          # inference miscompiles Contract::object() and every request fails.
          # Servers that enable JIT get PHP's default tracing mode, so test that.
          ini-values: opcache.jit=tracing
      - run: composer install --no-interaction --prefer-dist
      - name: Rehearse version 28 upgrade, interrupted DDL and backup recovery
        run: php scripts/test-isolated.php --upgrade-check --mysql-image=mysql:${{ matrix.mysql }}
      - name: Run only against a disposable database and isolated application
        run: php scripts/test-isolated.php --mysql-image=mysql:${{ matrix.mysql }} --log-junit "$RUNNER_TEMP/junit.xml"
      - name: Require every referenced parity test to have run and passed
        run: php scripts/check-agent-parity.php --junit="$RUNNER_TEMP/junit.xml"
      - name: Keep the complete JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}-mysql${{ matrix.mysql }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
  wonham-portable-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the portable local application with generated private credentials
        env:
          MANOR_SKIP_BROWSER: '1'
        run: ./START_LOCAL.sh
      - name: Identify the same local deployment for HTTP and fixture checks
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          values=dict(line.split('=',1) for line in pathlib.Path('.local/compose.env').read_text().splitlines() if '=' in line)
          command=['docker','compose','--project-name','wonham-local','--env-file','.local/compose.env','exec','-T','app','php','tests/Manor/config_fixture.php']
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('MANOR_TEST_URL=http://127.0.0.1:'+values['LOCAL_PORT']+'\n')
              output.write('MANOR_TEST_CONFIG=.local/compose.env\n')
              output.write('MANOR_FIXTURE_COMMAND='+json.dumps(command)+'\n')
          PY
      - name: Verify private documents and blocked legacy writes
        run: python3 tests/Manor/web_checks.py
      - name: Verify complete configuration, CMS publication, setup and language gates
        run: python3 tests/Manor/config_web_checks.py
      - name: Verify commercial workflow, invitations, RSVP and QR attendance
        run: python3 tests/Manor/workflow_web_checks.py
      - name: Verify Admin venue creation and public nightly booking
        run: python3 tests/Manor/venue_web_checks.py
      - name: Stop and remove the disposable deployment
        if: always()
        run: docker compose --project-name wonham-local --env-file .local/compose.env down --volumes
